<style>
/* Layout: one full-bleed canvas stage, letterboxed; DOM case-file cards float over it for menus. Deliberately single dark "noir" look. */
:root{
  --ink:#0c0e13; --ink-2:#161a22; --paper:#e8dcc0; --paper-dim:#b9ad93;
  --brass:#c9a24a; --blood:#9b2f2f; --fog:#717a8c;
  --f-display:"IM Fell English SC","IM Fell English",Georgia,"Times New Roman",serif;
  --f-body:"Courier Prime","Courier New",Courier,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,#1a1d26 0%,var(--ink) 70%)}
canvas{display:block;image-rendering:auto;box-shadow:0 0 0 1px #2a2c35,0 30px 80px #000}
#ui{position:fixed;inset:0;display:grid;place-items:center;overflow:auto;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(6,7,10,.72);backdrop-filter:blur(2px)}
.card{width:min(560px,100%);background:var(--paper);color:#241c12;padding:28px 28px 24px;position:relative;
  box-shadow:0 2px 0 #c8b994,0 24px 60px rgba(0,0,0,.6);transform:rotate(-.4deg);
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(80,60,30,.08) 27px 28px)}
.card::before{content:"CONFIDENTIAL";position:absolute;top:14px;right:18px;font:700 11px/1 var(--f-body);letter-spacing:.2em;color:var(--blood);border:2px solid var(--blood);padding:4px 6px;transform:rotate(6deg);opacity:.75}
h1{font:400 clamp(44px,9vw,72px)/.95 var(--f-display);margin:0 0 6px;color:#1a120a;text-wrap:balance;letter-spacing:.01em}
h2{font:400 30px/1.05 var(--f-display);margin:0 0 10px;text-wrap:balance}
.eyebrow{font:700 11px/1 var(--f-body);letter-spacing:.22em;text-transform:uppercase;color:#7a5a24;margin-bottom:14px}
p{margin:0 0 12px;font-size:15px;line-height:1.5;max-width:62ch}
.muted{color:#6a5b44;font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,.btn{font:700 15px/1 var(--f-body);letter-spacing:.04em;background:#1d1a16;color:var(--paper);border:0;padding:14px 16px;text-align:left;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;gap:12px;outline:none;transition:transform .08s,background .12s}
button .k{font-weight:400;color:var(--brass);font-size:12px;letter-spacing:.08em}
button:hover,button:focus-visible,button.focus{background:var(--blood);transform:translateX(4px)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none;background:#1d1a16}
button.ghost{background:transparent;color:#241c12;border:1.5px solid #241c12}
button.ghost:hover,button.ghost:focus-visible,button.ghost.focus{background:#241c12;color:var(--paper)}
label{font:700 11px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:#7a5a24;display:block;margin-bottom:6px}
input{font:700 18px/1 var(--f-body);background:#f6eedb;border:1.5px solid #241c12;padding:11px 12px;width:100%;color:#1a120a;outline:none}
input:focus-visible,input.focus{box-shadow:0 0 0 3px var(--brass)}
.field{flex:1;min-width:0}
.code{font:700 42px/1 var(--f-body);letter-spacing:.3em;color:var(--blood);margin:4px 0 10px}
.roster{list-style:none;padding:0;margin:12px 0;display:grid;gap:6px}
.roster li{display:flex;gap:10px;align-items:center;font-size:15px;padding:8px 10px;background:rgba(36,28,18,.07)}
.roster .dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
.roster .dev{margin-left:auto;font-size:12px;color:#6a5b44}
.roster li.empty{color:#8a7a60;font-style:italic}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:8px 0 14px}
.keys b{color:var(--blood)}
.note{font-size:13px;border-left:3px solid var(--brass);padding:6px 10px;background:rgba(201,162,74,.12);margin:10px 0}
#chat{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 24px));pointer-events:none;display:flex;flex-direction:column;gap:4px}
#chatlog div{font-size:13px;background:rgba(10,11,15,.78);padding:5px 8px;color:var(--paper);border-left:3px solid var(--brass);transition:opacity .6s}
#chatin{pointer-events:auto;font-size:14px;background:rgba(10,11,15,.92);color:var(--paper);border:1px solid var(--brass)}
#voicebar{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
#voicebar button{font-size:12px;padding:9px 12px;background:rgba(10,11,15,.88);border:1px solid var(--brass)}
#voicebar button.on{background:var(--blood)}
@media (prefers-reduced-motion:reduce){button{transition:none}.card{transform:none}}
</style>

function solidGrid(rid,fl){
  const R=ROOMS[rid], g=[];
  for(let y=0;y<ROWS;y++){g.push([]);for(let x=0;x<COLS;x++)g[y].push(x===0||y===0||x===COLS-1||y===ROWS-1?1:0)}
  for(const d of R.doors){ if(!d.req||fl[d.req]) g[d.y][d.x]=0 }
  for(const f of R.furn){
    const [x,y,w,h,k,,until]=f; if(until&&fl[until])continue;
    const s=WALKABLE[k]?0:1;
    for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++) if(g[j]&&g[j][i]!==undefined && !(j===0||i===0||j===ROWS-1||i===COLS-1)) g[j][i]=s;
  }

  return g;
}

  const words=text.split(' '),lines=[];let line='';
  for(const w of words){const t=line?line+' '+w:w; if(c.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}

}

let AC=null, master=null;
function audioInit(){
  if(AC)return; try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
  // rain bed: filtered noise
  const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5}
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
  const g=AC.createGain();g.gain.value=.22;src.connect(f);f.connect(g);g.connect(master);src.start();
  // drone
  const o=AC.createOscillator(),og=AC.createGain();o.type='sine';o.frequency.value=55;og.gain.value=.03;o.connect(og);og.connect(master);o.start();
}
function tone(freq,dur,type='sine',vol=.2,slide=0,delay=0){
  if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
}
function noiseBurst(dur,vol,freq){
  if(!AC)return;const len=AC.sampleRate*dur,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=AC.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(master);s.start();
}

    for(const k of ['lvA','lvB']){ if(F[k]>0){F[k]=Math.max(0,F[k]-dt)} }
    if(!F.gateOpen&&F.lvA>0&&F.lvB>0){F.gateOpen=1;F.lvA=0;F.lvB=0;pushFx('unlock');rumbleFx();toast('The iron gate grinds open!')}
  } else if(G.ph==='end'){
    for(const k in edges)if(edges[k].a&&G.tm>(G.endT||0)){endToTitle();return}
  }
  if(G.ph==='end'&&!G.endT)G.endT=G.tm+1.5;
  G.ts=G.ts.filter(t=>G.tm-t.t<4.5);
  G.fx=G.fx.filter(f=>G.tm-f.t<1.5);
}

/* ---------------------------- NETWORKING ---------------------------- */
// net: {mode:'room'|'peer', toAll(t,d), toHost(t,d), close()}
let net=null, roomApi=null, roomChecked=false;
const remoteLast={}; // cid -> time
let gotState=false, hiAcked=false, lastStateAt=0, lastSentInp='', lastInpAt=0;
function onlineMode(){
  if(window.claude&&typeof window.claude.use==='function')return roomApi?'room':(roomChecked?'none':'pending');
  return window.Peer?'peer':'none';
}
function checkRoom(){
  if(!(window.claude&&typeof window.claude.use==='function')){roomChecked=true;return}
  const done=()=>{roomChecked=true;if(['title','howto'].includes(screen)&&!ui.hidden)refreshUI()};
  window.claude.use('room').then(r=>{roomApi=r;done()}).catch(done);
}
async function connect(code,asHost){
  const mode=onlineMode();
  if(mode==='room'){
    const rm=await roomApi.join('harrow-'+code);
    const handlers={};
    const on=(t)=>rm.on(t,msg=>{if(msg.sameTab)return;handlers[t]&&handlers[t](msg.data)});
    ['hi','inp','st','chat','bye'].forEach(on);
    net={mode:'room',handlers,toAll:(t,d)=>rm.emit(t,d).catch(()=>{}),toHost:(t,d)=>rm.emit(t,d).catch(()=>{}),close:()=>rm.leave().catch(()=>{})};
    return net;
  }
  if(mode==='peer'){
    return await new Promise((res,rej)=>{
      const handlers={};const conns=new Map();
      const peer=asHost?new Peer('harrowhouse-'+code):new Peer();
      let done=false;const fail=m=>{if(!done){done=true;rej(new Error(m))}};
      setTimeout(()=>fail('Timed out reaching the matchmaking server.'),12000);
      peer.on('error',err=>{ if(err&&err.type==='unavailable-id')fail('That room code is already in use. Try hosting again.'); else if(err&&err.type==='peer-unavailable')fail('No game found with that code.'); else fail('Connection error: '+(err&&err.type||'unknown')) });
      peer.on('call',call=>{call.answer(micStream||undefined);attachCall(call)});
      peer.on('open',id=>{
        if(asHost){
          peer.on('connection',c=>{c.on('data',m=>{if(m&&m.t){conns.set(m.d&&m.d.cid||c.peer,c);handlers[m.t]&&handlers[m.t](m.d,c)}});c.on('close',()=>{for(const [k,v] of conns)if(v===c)conns.delete(k)})});
          net={mode:'peer',peer,handlers,toAll:(t,d)=>{for(const c of new Set(conns.values()))if(c.open)c.send({t,d})},toHost:()=>{},close:()=>{try{peer.destroy()}catch(e){}}};
          done=true;res(net);
        } else {
          const c=peer.connect('harrowhouse-'+code,{reliable:true});
          c.on('open',()=>{net={mode:'peer',peer,handlers,toAll:(t,d)=>c.send({t,d}),toHost:(t,d)=>c.send({t,d}),close:()=>{try{peer.destroy()}catch(e){}}};done=true;res(net)});
          c.on('data',m=>{if(m&&m.t)handlers[m.t]&&handlers[m.t](m.d)});
          c.on('close',()=>{if(role==='client')connectionLost('The host closed the game.')});
        }
      });
    });
  }
  throw new Error('Online play is not available here.');
}
function setupHostHandlers(){
  const h=net.handlers;
  h.hi=d=>{
    if(!d||typeof d.cid!=='string')return;remoteLast[d.cid]=performance.now();
    const locals=Array.isArray(d.locals)?d.locals.slice(0,4):[];
    for(const l of locals){
      if(typeof l.li!=='number')continue;
      if(!G.pl.some(p=>p.o===d.cid&&p.li===l.li)){ if(addPlayer(d.cid,l.li,String(l.name||'Detective'),String(l.dev||'remote'))){toast((l.name||'A detective')+' joined');if(G.ph==='play')placeNew()} }
    }
    if(d.pid&&net.mode==='peer'){}
  };
  h.inp=d=>{
    if(!d||typeof d.cid!=='string'||!d.l)return;remoteLast[d.cid]=performance.now();
    for(const k in d.l){const v=d.l[k];if(v&&typeof v==='object')inputs[d.cid+':'+k]={x:+v.x||0,y:+v.y||0,c:v.c||{}}}
  };
  h.chat=d=>{if(d&&d.m){showChat(String(d.n||'?'),String(d.m));if(net.mode==='peer')net.toAll('chat',d)}};
  h.bye=d=>{if(d&&d.cid)dropClient(d.cid)};
  h.voice=d=>{if(d&&d.pid&&!G.vp.includes(d.pid))G.vp.push(String(d.pid))};
}
function placeNew(){const a=G.pl[0];for(const p of G.pl){if(p.x===undefined){p.x=a.x;p.y=a.y}}}
function dropClient(c){
  const before=G.pl.length;G.pl=G.pl.filter(p=>p.o!==c);delete remoteLast[c];
  if(G.pl.length<before)toast('A detective left the investigation');
}
function setupClientHandlers(){
  const h=net.handlers;
  h.st=d=>{
    if(!d||typeof d!=='object'||!Array.isArray(d.pl))return;
    lastStateAt=performance.now();
    const prevPh=G&&G.ph;G=d;
    if(G.pl.filter(p=>p.o===cid).length>=localPlayers.length&&localPlayers.length)hiAcked=true;gotState=true;
    if(G.ph==='over'){connectionLost('The host ended the game.');return}
    if(prevPh!==G.ph||!prevPh)refreshUI();
    else if(G.ph==='lobby')renderLobbyRoster();
    syncVoice();
  };
  h.chat=d=>{if(d&&d.m&&d.cid!==cid)showChat(String(d.n||'?'),String(d.m))};
  ['hi','inp','bye','voice'].forEach(t=>h[t]=()=>{});
}
let stAcc=0;
function netTick(dt){
  if(!net)return;
  if(role==='host'){
    stAcc+=dt;
    if(stAcc>=1/12){stAcc=0;G.code=roomCode;net.toAll('st',G)}
    const now=performance.now();
    for(const c in remoteLast)if(now-remoteLast[c]>7000)dropClient(c);
  } else if(role==='client'){
    const now=performance.now();
    if(!hiAcked&&now-(net.lastHi||0)>1000){net.lastHi=now;sendHi()}
    const l={};for(const p of localPlayers){const d=dev(p.dev);l[p.li]={x:+d.x.toFixed(2),y:+d.y.toFixed(2),c:d.c}}
    const s=JSON.stringify(l);
    if((s!==lastSentInp&&now-lastInpAt>66)||now-lastInpAt>500){lastSentInp=s;lastInpAt=now;net.toHost('inp',{cid,l})}
    if(lastStateAt&&now-lastStateAt>8000)connectionLost(gotState?'Lost contact with the host.':'No host answered with that room code.');
  }
}
function sendHi(){if(net&&role==='client')net.toHost('hi',{cid,locals:localPlayers.map(p=>({li:p.li,name:p.name,dev:p.dev}))})}
let roomCode='';
function genCode(){return String(Math.floor(1000+Math.random()*9000))}
function connectionLost(msg){
  if(role!=='client')return;
  leaveNet();G=null;role='local';showScreen('title',msg);
}
function leaveNet(){
  if(net){try{if(role==='client')net.toHost('bye',{cid});if(role==='host'){G.ph='over';net.toAll('st',G)}}catch(e){} setTimeout(((n)=>()=>n.close())(net),200)}
  net=null;stopVoice();
}

/* ---------------------------- VOICE (standalone / peer mode) ---------------------------- */
let micStream=null, micOn=false; const calls={};
async function enableVoice(){
  if(!net||net.mode!=='peer')return;
  try{micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){showChat('System','Microphone blocked. Allow mic access in your browser to talk.');return}
  micOn=true;updateMic();
  const pid=net.peer.id;
  if(role==='host'){if(!G.vp.includes(pid))G.vp.push(pid)} else net.toHost('voice',{cid,pid});
  $('#voicebar').hidden=false;syncVoice();
}
function syncVoice(){
  if(!net||net.mode!=='peer'||!micStream||!G||!G.vp)return;
  const me=net.peer.id;
  for(const other of G.vp){ if(other!==me&&!calls[other]&&me<other){const c=net.peer.call(other,micStream);if(c)attachCall(c)} }
}
function attachCall(call){
  calls[call.peer]=call;
  call.on('stream',s=>{let a=document.getElementById('au-'+call.peer);if(!a){a=document.createElement('audio');a.id='au-'+call.peer;a.autoplay=true;document.body.appendChild(a)}a.srcObject=s;a.play().catch(()=>{})});
  call.on('close',()=>{delete calls[call.peer];const a=document.getElementById('au-'+call.peer);if(a)a.remove()});
}
function toggleMic(){
  if(!micStream){enableVoice();return}
  micOn=!micOn;micStream.getAudioTracks().forEach(t=>t.enabled=micOn);updateMic();
}
function updateMic(){const b=$('#micbtn');b.classList.toggle('on',micOn);b.innerHTML=(micOn?'Mic on':'Mic muted')+' <span class="k">V / View</span>'}
function stopVoice(){for(const k in calls){try{calls[k].close()}catch(e){}delete calls[k]}if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}micOn=false;$('#voicebar').hidden=true}
$('#micbtn').addEventListener('click',toggleMic);

function uiPadNav(){

  const pads=navigator.getGamepads?navigator.getGamepads():[];

    const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed),ay=gp.axes[1]||0;
    const st={up:b(12)||ay<-.6,dn:b(13)||ay>.6,a:b(0),b:b(1),s:b(9)};
    const edge=k=>st[k]&&!pv[k];
    const joined=localPlayers.some(p=>p.dev===id);
    if(edge('up')||edge('dn')){navIndex=(navIndex<0?0:navIndex+(edge('dn')?1:-1)+els.length)%els.length;els.forEach(e=>e.classList.remove('focus'));els[navIndex].classList.add('focus');els[navIndex].focus({preventScroll:false});SFX.tick()}
    if(edge('a')&&(screen!=='lobby'||joined)){const el=els[navIndex]||els[0];if(el.tagName==='INPUT')el.focus();else el.click()}
    if(edge('b')){const bk=ui.querySelector('[data-back]');if(bk)bk.click()}

  for(const f of R.furn)if(f[4]==='fire')light(f[0]*TS+f[2]*TS/2,f[1]*TS+HUD+20,TS*4.5*(1+Math.sin(t*8)*.05),.9);
  for(const [wx,wy] of R.windows)light(wx*TS+16,wy*TS+HUD+16,TS*(1.4+flash*4),.5+flash);
  for(const s of R.spots)if(!F['s_'+s.id]&&!s.npc)light((s.x+.5)*TS,(s.y+.5)*TS+HUD,TS*.9,.5);
  ctx.drawImage(lightCv,0,0,W,H);
  // warm lamp tint
  ctx.globalCompositeOperation='lighter';
  for(const [lx,ly,lr] of R.lamps){const g=ctx.createRadialGradient(lx*TS,ly*TS+HUD,0,lx*TS,ly*TS+HUD,lr*TS);g.addColorStop(0,'rgba(120,70,20,.22)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(lx*TS-lr*TS,ly*TS+HUD-lr*TS,lr*TS*2,lr*TS*2)}
  ctx.globalCompositeOperation='source-over';
  // prompts for local players
  if(!G.md&&G.ph==='play')for(const lp of localPlayers){
    const p=G.pl.find(p=>p.o===cid&&p.li===lp.li);if(!p)continue;const q=pos(p,0);
    let best=null,bd=1.45;for(const s of R.spots){const d=Math.hypot(q.x-(s.x+.5),q.y-(s.y+.5));if(d<bd){bd=d;best=s}}
    if(best){const x=(best.x+.5)*TS,y=(best.y+.5)*TS+HUD-26;const label=(lp.dev.startsWith('gp')?'A':lp.dev==='kb2'?'/':'E')+'  '+spotLabel(best);
      ctx.font='bold 12px "Courier Prime",monospace';const tw=ctx.measureText(label).width+16;ctx.fillStyle='rgba(232,220,192,.95)';ctx.fillRect(x-tw/2,y-14,tw,20);ctx.fillStyle=COLORS[p.c];ctx.fillRect(x-tw/2,y+4,tw,2);
      ctx.fillStyle='#1a120a';ctx.textAlign='center';ctx.fillText(label,x,y);}
  }
  drawHud(t);
  // toasts
  ctx.textAlign='center';
  G.ts.forEach((ts,i)=>{const age=G.tm-ts.t,a=Math.min(1,(4.5-age)*2);ctx.globalAlpha=Math.max(0,a);ctx.font='bold 14px "Courier Prime",monospace';const tw=ctx.measureText(ts.s).width+28;const y=H-40-(G.ts.length-1-i)*30;
    ctx.fillStyle='rgba(12,14,19,.9)';ctx.fillRect(W/2-tw/2,y-17,tw,26);ctx.fillStyle='#c9a24a';ctx.fillRect(W/2-tw/2,y-17,3,26);ctx.fillStyle='#e8dcc0';ctx.fillText(ts.s,W/2,y);ctx.globalAlpha=1});
  if(G.md)drawModal(t);

}
function drawHud(t){

  ctx.textAlign='center';ctx.font='bold 12px "Courier Prime",monospace';ctx.fillStyle='#b9ad93';

function ownerName(){const p=G.pl.find(p=>pkey(p)===G.md.ow);return p?{n:p.n,c:COLORS[p.c],mine:p.o===cid}:{n:'',c:'#888',mine:false}}

/* ---------------------------- MAIN LOOP ---------------------------- */
let last=performance.now();
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px'}
addEventListener('resize',fit);fit();
function playFx(){
  if(!G||!G.fx)return;
  for(const f of G.fx){ if(f.i>fxSeen){fxSeen=f.i; if(f.k==='rumble')rumble(.8,300); else {SFX[f.k]&&SFX[f.k](); if(f.k==='clue'||f.k==='unlock')rumble(.5,150)} } }
}
let prevRole=null,prevG=null;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  sampleKeyboard();samplePads();uiPadNav();
  if(G&&(G.ph==='lobby'||G.ph==='play'))lobbyJoins();else syncSeenIfIdle();
  rosterWatch();
  padPauseCheck();
  if(G&&role!=='client'&&!(screen==='pause'&&role==='local'))hostTick(dt);
  netTick(dt);
  if(G!==prevG||role!==prevRole){if(!G||role!==prevRole)fxSeen=G?G.fxn||0:0;prevG=G;prevRole=role}
  playFx();
  if(G&&(G.ph==='play'||G.ph==='end')&&!ui.hidden&&screen!=='pause'){refreshUI()}
  render(dt,now/1000);
  requestAnimationFrame(loop);
}
let idleSync=0;function syncSeenIfIdle(){ if(!G||G.ph!=='lobby'){for(const id in devs){devs[id]._seenA=devs[id].c.a}} }
checkRoom();

showScreen('title');
setTimeout(()=>{if(screen==='title'&&!ui.hidden)refreshUI()},1500);
requestAnimationFrame(loop);
addEventListener('beforeunload',()=>{try{if(net&&role==='client')net.toHost('bye',{cid})}catch(e){}});
